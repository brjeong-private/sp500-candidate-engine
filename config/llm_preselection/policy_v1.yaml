  earnings_events: 2
  filings_days: 365
  fact_quarters: 8
  corporate_actions_days: 365
  price_sessions: 60
limits:
  news_items: 30
  filings: 20
  facts: 80
  corporate_actions: 20
  rationale_characters: 600
  packet_characters: 48000
  total_input_tokens: 2500000
retries:
  max_attempts: 3
  base_delay_seconds: 1.0
