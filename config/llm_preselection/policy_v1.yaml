name: daily-llm-preselection
version: "1"
selection_type: LLM_PRESELECTION
score_semantics: LLM_EVIDENCE_SCORE
evidence_schema_version: "1"
prompt_version: llm-preselection-v1
requested_count: 20
first_stage_pool_size: 60
batch_size: 5
windows:
