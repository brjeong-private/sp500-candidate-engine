name: alpha158-lightgbm-forward-return
version: "2"
seed: 42
prediction_semantics: PREDICTED_5D_RETURN
model:
  loss: mse
  learning_rate: 0.03
  num_leaves: 31
  max_depth: 6
  min_data_in_leaf: 20
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l1: 0.1
  lambda_l2: 1.0
  num_threads: 4
  deterministic: true
  force_col_wise: true
  num_boost_round: 300
  early_stopping_rounds: 30
walk_forward:
  minimum_train_sessions: 100
  validation_sessions: 30
  test_sessions: 30
  step_sessions: 30
  minimum_test_sessions: 20
  purge_by_label_exit: true
evaluation:
  top_k: [5, 10]
  holding_period_sessions: 5
  round_trip_cost_bps: 10
  overlapping_cohort_allocation: 0.2
baselines:
  momentum_lookback_sessions: 20
  ridge_alpha: 10.0
